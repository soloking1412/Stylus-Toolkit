<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylus Toolkit - Gas Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #334155;
    }

    .stat-label {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #10b981;
    }

    .stat-value.negative {
      color: #ef4444;
    }

    .chart-container {
      background: #1e293b;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid #334155;
    }

    .chart-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #f1f5f9;
    }

    canvas {
      max-height: 400px;
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: #94a3b8;
    }

    .error {
      background: #7f1d1d;
      border: 1px solid #991b1b;
      border-radius: 12px;
      padding: 20px;
      color: #fecaca;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Stylus Toolkit Analytics</h1>
      <p class="subtitle">Real-time gas profiling insights for your Arbitrum Stylus contracts</p>
    </header>

    <div id="loading" class="loading">
      <p>Loading analytics data...</p>
    </div>

    <div id="error" class="error" style="display: none;">
      <h3>Error Loading Data</h3>
      <p id="error-message"></p>
    </div>

    <div id="dashboard" style="display: none;">
      <div id="stats" class="stats-grid"></div>

      <div class="chart-container">
        <h2 class="chart-title">Total Cost of Ownership (TCO) Trends</h2>
        <canvas id="tcoChart"></canvas>
      </div>

      <div class="chart-container">
        <h2 class="chart-title">Gas Savings by Contract</h2>
        <canvas id="savingsChart"></canvas>
      </div>

      <div class="chart-container">
        <h2 class="chart-title">Deployment vs Execution Costs</h2>
        <canvas id="costsChart"></canvas>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
